    <text x="22" y="72" fill="#486075" font-family="Arial,sans-serif" font-size="13">Serviços, integrações, dados</text>
    <text x="22" y="91" fill="#486075" font-family="Arial,sans-serif" font-size="13">e limites que fazem sentido.</text>
    <path d="M22 119H112M120 119H208M216 119H306" stroke="#A4C8DB" stroke-width="3" stroke-linecap="round"/>
    <circle cx="112" cy="119" r="4" fill="#006C9D"/><circle cx="208" cy="119" r="4" fill="#00875A"/>
  </g>
  <g transform="translate(424 48)">
