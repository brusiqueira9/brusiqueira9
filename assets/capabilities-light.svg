    <text x="61" y="33" fill="#14212D" font-family="Arial,sans-serif" font-size="17" font-weight="700">Produtos web</text>
    <text x="22" y="72" fill="#486075" font-family="Arial,sans-serif" font-size="13">Interfaces, APIs e automações</text>
    <text x="22" y="91" fill="#486075" font-family="Arial,sans-serif" font-size="13">que cabem na rotina de alguém.</text>
    <path d="M22 119H112M120 119H208M216 119H306" stroke="#B6DCCB" stroke-width="3" stroke-linecap="round"/>
    <circle cx="112" cy="119" r="4" fill="#006C9D"/><circle cx="208" cy="119" r="4" fill="#00875A"/>
  </g>
  <g transform="translate(814 48)">
