<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">O que Bruno Siqueira constrói</title>
  <desc id="desc">Arquitetura, produtos web e operação, apresentados em três blocos compactos.</desc>
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#006C9D"/>
      <stop offset="1" stop-color="#00875A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="220" rx="18" fill="#F7F9FC"/>
  <path d="M34 28H1166" stroke="#D7E1EA"/>
  <path d="M34 28H240" stroke="#006C9D" stroke-width="3"/>
  <text x="36" y="18" fill="#006C9D" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">COMO EU TRANSFORMO IDEIAS EM ENTREGA</text>
  <g transform="translate(34 48)">
    <rect width="352" height="142" rx="14" fill="#EAF6FF" stroke="#B9D7E8"/>
