<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Sinais de entrega e tecnologias centrais de Bruno Siqueira</title>
  <desc id="desc">Painel com tecnologias web, APIs, cloud, dados e quatro sinais do trabalho profissional.</desc>
  <rect width="1200" height="250" rx="16" fill="#0B0F14"/>
  <rect x="16" y="16" width="430" height="218" rx="12" fill="#001A33" stroke="#294050"/>
  <rect x="462" y="16" width="722" height="218" rx="12" fill="#111A24" stroke="#294050"/>
  <text x="42" y="52" fill="#B7D6E8" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">TECNOLOGIAS CENTRAIS</text>
  <text x="42" y="78" fill="#F7F9FC" font-family="Inter,Arial,sans-serif" font-size="14">Construo entre produto, integração e operação.</text>
  <g font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">
    <rect x="42" y="105" width="104" height="34" rx="17" fill="#0033FF"/><text x="94" y="127" text-anchor="middle" fill="#FFF">Web</text>
    <rect x="158" y="105" width="104" height="34" rx="17" fill="#00B0FF"/><text x="210" y="127" text-anchor="middle" fill="#001A33">APIs</text>
    <rect x="274" y="105" width="104" height="34" rx="17" fill="#00A86B"/><text x="326" y="127" text-anchor="middle" fill="#FFF">Cloud</text>
    <rect x="42" y="151" width="104" height="34" rx="17" fill="#28465C"/><text x="94" y="173" text-anchor="middle" fill="#F7F9FC">Dados</text>
    <rect x="158" y="151" width="104" height="34" rx="17" fill="#4040FF"/><text x="210" y="173" text-anchor="middle" fill="#FFF">Linux</text>
    <rect x="274" y="151" width="104" height="34" rx="17" fill="#008F6A"/><text x="326" y="173" text-anchor="middle" fill="#FFF">Firebird</text>
  </g>
  <text x="42" y="211" fill="#7F9BAD" font-family="JetBrains Mono,Consolas,monospace" font-size="11">bruno-siqueira / delivery-system</text>
  <text x="490" y="52" fill="#B7D6E8" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">SINAIS DO TRABALHO</text>
  <g transform="translate(850 125)" fill="none" stroke-width="15">
    <circle r="52" stroke="#263542"/>
    <circle r="52" stroke="#00B0FF" stroke-dasharray="72 255" transform="rotate(-90)"/>
    <circle r="52" stroke="#0033FF" stroke-dasharray="72 255" transform="rotate(0)"/>
    <circle r="52" stroke="#00A86B" stroke-dasharray="72 255" transform="rotate(90)"/>
    <circle r="52" stroke="#FF00FF" stroke-dasharray="72 255" transform="rotate(180)"/>
    <text y="6" text-anchor="middle" fill="#F7F9FC" stroke="none" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="800">04</text>
    <text y="23" text-anchor="middle" fill="#7F9BAD" stroke="none" font-family="Inter,Arial,sans-serif" font-size="10">camadas</text>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <text x="530" y="91" fill="#F7F9FC" font-size="24" font-weight="800">03+</text><text x="530" y="111" fill="#7F9BAD" font-size="11">anos de experiência</text>
    <text x="530" y="159" fill="#F7F9FC" font-size="24" font-weight="800">10+</text><text x="530" y="179" fill="#7F9BAD" font-size="11">soluções entregues</text>
    <text x="1030" y="91" fill="#F7F9FC" font-size="24" font-weight="800">06</text><text x="1030" y="111" fill="#7F9BAD" font-size="11">projetos destacados</text>
    <text x="1030" y="159" fill="#F7F9FC" font-size="24" font-weight="800">02</text><text x="1030" y="179" fill="#7F9BAD" font-size="11">produtos públicos</text>
    <circle cx="1016" cy="87" r="4" fill="#00B0FF"/><circle cx="1016" cy="155" r="4" fill="#00A86B"/>
  </g>
</svg>
