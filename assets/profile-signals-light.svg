<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">Visão rápida do trabalho de Bruno Siqueira</title>
  <desc id="desc">Processo de entrega e quatro indicadores do perfil em tema claro.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#006C9D"/>
      <stop offset="1" stop-color="#00875A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="310" rx="18" fill="#F7F9FC"/>
  <rect x="24" y="24" width="734" height="262" rx="15" fill="#EAF6FF" stroke="#B9D7E8"/>
  <rect x="782" y="24" width="394" height="262" rx="15" fill="#FFFFFF" stroke="#D7E1EA"/>
  <path d="M24 24H758" stroke="#006C9D" stroke-width="4"/>
