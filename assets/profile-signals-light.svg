    <text x="810" y="102" fill="#006C9D" font-size="28" font-weight="700">14</text><text x="858" y="101" fill="#294A60" font-size="12">repos públicos</text>
    <text x="810" y="151" fill="#006C9D" font-size="28" font-weight="700">05</text><text x="858" y="150" fill="#294A60" font-size="12">projetos selecionados</text>
    <text x="810" y="200" fill="#00875A" font-size="28" font-weight="700">01</text><text x="858" y="199" fill="#294A60" font-size="12">app público</text>
    <text x="810" y="249" fill="#00875A" font-size="28" font-weight="700">10+</text><text x="878" y="248" fill="#294A60" font-size="12">entregas corporativas</text>
