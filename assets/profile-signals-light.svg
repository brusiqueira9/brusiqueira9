  <path d="M48 251H722" stroke="#B9D7E8"/>
  <text x="48" y="271" fill="#486075" font-family="Arial,sans-serif" font-size="12">A solução precisa ser útil no primeiro dia e sustentável depois.</text>
  <text x="810" y="57" fill="#00875A" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">INDICADORES DO PERFIL</text>
