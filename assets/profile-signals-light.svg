  <text x="48" y="57" fill="#006C9D" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">PROCESSO DE ENTREGA</text>
  <text x="48" y="87" fill="#14212D" font-family="Arial,sans-serif" font-size="22" font-weight="700">Do problema ao sistema</text>
  <text x="48" y="112" fill="#486075" font-family="Arial,sans-serif" font-size="13">Clareza antes da complexidade.</text>
  <path d="M88 184H686" stroke="#A4C8DB" stroke-width="3" stroke-linecap="round"/>
  <path d="M88 184H686" stroke="url(#accent)" stroke-width="2" stroke-dasharray="3 13" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <circle cx="88" cy="184" r="13" fill="#D2ECFA" stroke="#006C9D" stroke-width="2"/><circle cx="288" cy="184" r="13" fill="#D2ECFA" stroke="#006C9D" stroke-width="2"/><circle cx="488" cy="184" r="13" fill="#DFF7EC" stroke="#00875A" stroke-width="2"/><circle cx="686" cy="184" r="13" fill="#DFF7EC" stroke="#00875A" stroke-width="2"/>
    <text x="88" y="188" fill="#14212D" font-size="12" font-weight="700">01</text><text x="288" y="188" fill="#14212D" font-size="12" font-weight="700">02</text><text x="488" y="188" fill="#14212D" font-size="12" font-weight="700">03</text><text x="686" y="188" fill="#14212D" font-size="12" font-weight="700">04</text>
    <text x="88" y="218" fill="#294A60" font-size="12">entender</text><text x="288" y="218" fill="#294A60" font-size="12">organizar</text><text x="488" y="218" fill="#294A60" font-size="12">construir</text><text x="686" y="218" fill="#294A60" font-size="12">evoluir</text>
