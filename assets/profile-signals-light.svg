<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Visão rápida do trabalho de Bruno Siqueira</title>
  <desc id="desc">Painel com o processo de trabalho, tecnologias centrais e indicadores públicos do perfil.</desc>
  <rect width="1200" height="320" rx="18" fill="#F7F9FC"/>
  <rect x="18" y="18" width="426" height="284" rx="14" fill="#EAF6FF" stroke="#C8DFEC"/>
  <rect x="462" y="18" width="720" height="284" rx="14" fill="#FFFFFF" stroke="#D7E1EA"/>

  <text x="46" y="57" fill="#006C9D" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">PROCESSO DE ENTREGA</text>
  <text x="46" y="87" fill="#14212D" font-family="Arial, sans-serif" font-size="17" font-weight="700">Do problema ao sistema</text>
  <text x="46" y="112" fill="#486075" font-family="Arial, sans-serif" font-size="13">Clareza antes da complexidade.</text>

  <path d="M73 153 H362" stroke="#B4CFDE" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <circle cx="73" cy="153" r="10" fill="#00B0FF"/>
    <circle cx="169" cy="153" r="10" fill="#0033FF"/>
    <circle cx="265" cy="153" r="10" fill="#00A86B"/>
    <circle cx="362" cy="153" r="10" fill="#00B0FF"/>
    <text x="73" y="190" fill="#14212D" font-size="12" text-anchor="middle">entender</text>
    <text x="73" y="207" fill="#486075" font-size="11" text-anchor="middle">o processo</text>
    <text x="169" y="190" fill="#14212D" font-size="12" text-anchor="middle">organizar</text>
    <text x="169" y="207" fill="#486075" font-size="11" text-anchor="middle">domínio e dados</text>
    <text x="265" y="190" fill="#14212D" font-size="12" text-anchor="middle">construir</text>
    <text x="265" y="207" fill="#486075" font-size="11" text-anchor="middle">com clareza</text>
    <text x="362" y="190" fill="#14212D" font-size="12" text-anchor="middle">evoluir</text>
    <text x="362" y="207" fill="#486075" font-size="11" text-anchor="middle">com segurança</text>
  </g>
  <text x="46" y="263" fill="#006C9D" font-family="Consolas, monospace" font-size="12">web / APIs / cloud / dados / operação</text>

  <text x="490" y="57" fill="#006C9D" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">INDICADORES DO PERFIL</text>
  <g font-family="Arial, sans-serif">
    <rect x="490" y="80" width="322" height="84" rx="12" fill="#F8FBFD" stroke="#D7E1EA"/>
    <rect x="832" y="80" width="322" height="84" rx="12" fill="#F8FBFD" stroke="#D7E1EA"/>
    <rect x="490" y="180" width="322" height="84" rx="12" fill="#F8FBFD" stroke="#D7E1EA"/>
    <rect x="832" y="180" width="322" height="84" rx="12" fill="#F8FBFD" stroke="#D7E1EA"/>
    <text x="516" y="122" fill="#14212D" font-size="28" font-weight="800">14</text>
    <text x="516" y="145" fill="#486075" font-size="12">repositórios públicos</text>
    <text x="858" y="122" fill="#14212D" font-size="28" font-weight="800">06</text>
    <text x="858" y="145" fill="#486075" font-size="12">projetos em destaque</text>
    <text x="516" y="222" fill="#14212D" font-size="28" font-weight="800">02</text>
    <text x="516" y="245" fill="#486075" font-size="12">produtos públicos</text>
    <text x="858" y="222" fill="#14212D" font-size="28" font-weight="800">10+</text>
    <text x="858" y="245" fill="#486075" font-size="12">entregas corporativas</text>
    <rect x="789" y="105" width="4" height="34" rx="2" fill="#00B0FF"/>
    <rect x="1131" y="105" width="4" height="34" rx="2" fill="#0033FF"/>
    <rect x="789" y="205" width="4" height="34" rx="2" fill="#00A86B"/>
    <rect x="1131" y="205" width="4" height="34" rx="2" fill="#00B0FF"/>
