name: Atualizar métricas do perfil

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do perfil
        uses: actions/checkout@v4

      - name: Gerar painel geral
        uses: lowlighter/metrics@latest
        with:
          filename: assets/github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: brusiqueira9
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          config_animations: yes
          config_padding: 8
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 6
          plugin_languages_threshold: 2%
          plugin_languages_colors: "javascript:#00B0FF, typescript:#0033FF, html:#00A86B, css:#00B0FF, shell:#0033FF"
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugins_errors_fatal: no
          output_action: none

      - name: Gerar painel de linguagens
        uses: lowlighter/metrics@latest
        with:
          filename: assets/github-languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: brusiqueira9
          template: classic
          base: ""
          config_timezone: America/Sao_Paulo
          config_animations: yes
          config_padding: 8
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 6
          plugin_languages_threshold: 2%
          plugin_languages_colors: "javascript:#00B0FF, typescript:#0033FF, html:#00A86B, css:#00B0FF, shell:#0033FF"
          plugins_errors_fatal: no
          output_action: none

      - name: Gerar calendário de contribuições
        uses: lowlighter/metrics@latest
        with:
          filename: assets/github-calendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: brusiqueira9
          template: classic
          base: ""
          config_timezone: America/Sao_Paulo
          config_animations: yes
          config_padding: 8
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugins_errors_fatal: no
          output_action: none

      - name: Publicar os gráficos
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-metrics.svg assets/github-languages.svg assets/github-calendar.svg
          git diff --cached --quiet || git commit -m "chore: atualizar métricas do perfil"
          git push
